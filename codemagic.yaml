workflows:
  # ── iOS: app + CallKit Call Directory extension ────────────
  ios-release:
    name: iOS
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ikonet Solutions
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - blacklist_appstore
          - blacklist_calldirectory_appstore
        certificates:
          - ithelpdesk_distribution_20260916
      vars:
        BUNDLE_ID: com.konechoco.blacklist
        API_BASE: https://blacklist.ikonetsolutions.com
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Add Call Directory extension to the Xcode project
        script: |
          gem install xcodeproj --user-install --no-document
          ruby ios/scripts/add_call_directory.rb
      - name: Set AdMob app id
        script: |
          if [ -n "$IOS_ADMOB_APP_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $IOS_ADMOB_APP_ID" ios/Runner/Info.plist
          fi
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_NUMBER=$(date +%y%m%d%H%M)
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE="$API_BASE" \
            --dart-define=UNITY_GAME_ID_IOS="$UNITY_GAME_ID_IOS" \
            --dart-define=ADMOB_BANNER_IOS="$ADMOB_BANNER_IOS" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # ── Android: CallScreeningService ──────────────────────────
  android-release:
    name: Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      android_signing:
        - blacklist_upload
      groups:
        - google_play
      vars:
        API_BASE: https://blacklist.ikonetsolutions.com
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Set up local properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get packages
        script: flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-number=$(date +%y%m%d%H) \
            --dart-define=API_BASE="$API_BASE" \
            --dart-define=UNITY_GAME_ID_ANDROID="$UNITY_GAME_ID_ANDROID" \
            --dart-define=ADMOB_BANNER_ANDROID="$ADMOB_BANNER_ANDROID"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        track: internal
        submit_as_draft: true
