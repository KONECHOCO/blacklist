# Blacklist API on the shared Hetzner VPS: container "blacklist-api" on host port 8092
# (RF Terminal uses 8090, MM Connect 8091). The host nginx proxies to it.
services:
  blacklist-api:
    build: .
    container_name: blacklist-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8092:8000"
